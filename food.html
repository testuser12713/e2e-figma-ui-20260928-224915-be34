<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Management — BusinessHandler</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/food.css">
</head>
<body>
  <div class="app-shell">

    <aside class="side-nav">
      <div class="brand">Business<span class="brand-accent">Handler</span></div>
      <a class="nav-item" href="index.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a class="nav-item is-active" href="food.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        Food Management
      </a>
      <a class="nav-item" href="time.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Time Management
      </a>
    </aside>

    <div class="main">
      <main class="content">
        <section class="food-panel" aria-label="Gerichteliste">
          <div class="food-toolbar">
            <h2 class="food-section-title">Gerichte</h2>
            <button type="button" class="btn btn-primary" id="add-food-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
              Neues Gericht
            </button>
          </div>
          <ul class="food-list" id="food-list"></ul>
          <p class="food-empty" id="food-empty" hidden>Noch keine Gerichte angelegt.</p>
        </section>
      </main>
    </div>

    <nav class="bottom-nav" aria-label="Navigation">
      <a class="nav-item" href="index.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a class="nav-item is-active" href="food.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        Food Management
      </a>
      <a class="nav-item" href="time.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Time Management
      </a>
    </nav>

    <div class="modal-overlay" id="food-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="food-modal-title">
        <h2 class="modal-title" id="food-modal-title">Neues Gericht</h2>
        <form id="food-form" novalidate>
          <input type="hidden" id="food-id">
          <div class="field">
            <label class="field-label" for="food-name">Name</label>
            <input class="input" id="food-name" type="text" required autocomplete="off">
          </div>
          <div class="field">
            <label class="field-label" for="food-price">Preis (€)</label>
            <input class="input" id="food-price" type="number" step="0.10" min="0" required inputmode="decimal">
          </div>
          <div class="field">
            <label class="field-label" for="food-category">Kategorie</label>
            <input class="input" id="food-category" type="text" required autocomplete="off">
          </div>
          <div class="field">
            <label class="field-label" for="food-description">Beschreibung</label>
            <textarea class="input" id="food-description" rows="3"></textarea>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="cancel-food-btn">Abbrechen</button>
            <button type="submit" class="btn btn-primary" id="save-food-btn">Speichern</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <script src="js/food.js"></script>
</body>
</html>
