<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Management — BusinessHandler</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">

    <aside class="side-nav" data-od-id="side-nav">
      <div class="brand">Business<span class="brand-accent">Handler</span></div>
      <a class="nav-item" href="dashboard.html" data-od-id="nav-dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a class="nav-item active" href="food-management.html" data-od-id="nav-food">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        Speisen
      </a>
      <a class="nav-item" href="time-management.html" data-od-id="nav-time">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Zeiten
      </a>
    </aside>

    <div class="main">
      <main class="content" data-od-id="food-main">

        <header class="page-header" data-od-id="food-header">
          <div class="header-row">
            <div>
              <h1 class="page-title">Food Management</h1>
              <p class="page-subtitle">Speisen anlegen, bearbeiten und entfernen</p>
            </div>
            <button class="btn btn-primary" id="add-btn" data-od-id="food-add-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
              Speise hinzufügen
            </button>
          </div>
        </header>

        <section class="section" data-od-id="food-list-section">
          <h2 class="section-title">Alle Speisen</h2>
          <div class="list" id="food-list" data-od-id="food-list"></div>
          <p class="empty-state" id="food-empty" hidden>Noch keine Speisen vorhanden.</p>
        </section>

      </main>
    </div>

    <nav class="bottom-nav" data-od-id="bottom-nav">
      <a class="nav-item" href="dashboard.html" data-od-id="mnav-dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a class="nav-item active" href="food-management.html" data-od-id="mnav-food">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        Speisen
      </a>
      <a class="nav-item" href="time-management.html" data-od-id="mnav-time">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Zeiten
      </a>
    </nav>

  </div>

  <div class="modal-overlay" id="dish-modal" hidden data-od-id="dish-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dish-modal-title">
      <h2 class="modal-title" id="dish-modal-title">Speise hinzufügen</h2>
      <form id="dish-form">
        <div class="field">
          <label for="dish-name">Name</label>
          <input class="input" id="dish-name" type="text" placeholder="z. B. Wiener Schnitzel" required>
        </div>
        <div class="field">
          <label for="dish-category">Kategorie</label>
          <select class="input" id="dish-category">
            <option value="Vorspeise">Vorspeise</option>
            <option value="Hauptgericht">Hauptgericht</option>
            <option value="Dessert">Dessert</option>
            <option value="Getränk">Getränk</option>
          </select>
        </div>
        <div class="field">
          <label for="dish-price">Preis (€)</label>
          <input class="input" id="dish-price" type="number" step="0.10" min="0" placeholder="18,90" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="dish-cancel" data-od-id="dish-cancel">Abbrechen</button>
          <button type="submit" class="btn btn-primary" data-od-id="dish-save">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="delete-modal" hidden data-od-id="delete-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
      <h2 class="modal-title" id="delete-modal-title">Speise löschen</h2>
      <p class="modal-text" id="delete-modal-text">Möchtest du diese Speise wirklich löschen?</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="delete-cancel" data-od-id="delete-cancel">Abbrechen</button>
        <button type="button" class="btn btn-danger" id="delete-confirm" data-od-id="delete-confirm">Löschen</button>
      </div>
    </div>
  </div>

  <script>
    const CATEGORIES = ['Vorspeise', 'Hauptgericht', 'Dessert', 'Getränk'];

    let dishes = [
      { id: 1, name: 'Wiener Schnitzel', category: 'Hauptgericht', price: 18.90 },
      { id: 2, name: 'Carpaccio', category: 'Vorspeise', price: 12.50 },
      { id: 3, name: 'Tiramisu', category: 'Dessert', price: 7.20 },
      { id: 4, name: 'Risotto ai Funghi', category: 'Hauptgericht', price: 15.40 },
      { id: 5, name: 'Bruschetta', category: 'Vorspeise', price: 6.80 },
      { id: 6, name: 'Panna Cotta', category: 'Dessert', price: 6.50 }
    ];

    let nextId = 7;
    let editingId = null;
    let deletingId = null;

    const listEl = document.getElementById('food-list');
    const emptyEl = document.getElementById('food-empty');
    const dishModal = document.getElementById('dish-modal');
    const deleteModal = document.getElementById('delete-modal');
    const form = document.getElementById('dish-form');
    const dishModalTitle = document.getElementById('dish-modal-title');
    const nameInput = document.getElementById('dish-name');
    const categoryInput = document.getElementById('dish-category');
    const priceInput = document.getElementById('dish-price');
    const deleteText = document.getElementById('delete-modal-text');

    function formatPrice(value) {
      return value.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
    }

    function render() {
      listEl.innerHTML = '';
      if (dishes.length === 0) {
        emptyEl.hidden = false;
        return;
      }
      emptyEl.hidden = true;
      dishes.forEach(function (dish) {
        var row = document.createElement('div');
        row.className = 'list-row';
        row.setAttribute('data-od-id', 'food-row-' + dish.id);

        var info = document.createElement('div');
        info.className = 'list-info';
        var title = document.createElement('p');
        title.className = 'list-title';
        title.textContent = dish.name;
        var sub = document.createElement('p');
        sub.className = 'list-subtitle';
        sub.textContent = dish.category + ' · ' + formatPrice(dish.price);
        info.appendChild(title);
        info.appendChild(sub);

        var actions = document.createElement('div');
        actions.className = 'list-actions';

        var editBtn = document.createElement('button');
        editBtn.className = 'icon-btn';
        editBtn.setAttribute('aria-label', 'Bearbeiten');
        editBtn.setAttribute('data-od-id', 'food-edit-' + dish.id);
        editBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>';
        editBtn.addEventListener('click', function () { openEdit(dish.id); });

        var delBtn = document.createElement('button');
        delBtn.className = 'icon-btn danger';
        delBtn.setAttribute('aria-label', 'Löschen');
        delBtn.setAttribute('data-od-id', 'food-delete-' + dish.id);
        delBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
        delBtn.addEventListener('click', function () { openDelete(dish.id); });

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);

        row.appendChild(info);
        row.appendChild(actions);
        listEl.appendChild(row);
      });
    }

    function openAdd() {
      editingId = null;
      dishModalTitle.textContent = 'Speise hinzufügen';
      form.reset();
      categoryInput.value = 'Hauptgericht';
      dishModal.hidden = false;
      nameInput.focus();
    }

    function openEdit(id) {
      var dish = dishes.find(function (d) { return d.id === id; });
      if (!dish) return;
      editingId = id;
      dishModalTitle.textContent = 'Speise bearbeiten';
      nameInput.value = dish.name;
      categoryInput.value = dish.category;
      priceInput.value = dish.price;
      dishModal.hidden = false;
      nameInput.focus();
    }

    function openDelete(id) {
      var dish = dishes.find(function (d) { return d.id === id; });
      if (!dish) return;
      deletingId = id;
      deleteText.textContent = 'Möchtest du „' + dish.name + '“ wirklich löschen?';
      deleteModal.hidden = false;
    }

    function closeModals() {
      dishModal.hidden = true;
      deleteModal.hidden = true;
      editingId = null;
      deletingId = null;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var name = nameInput.value.trim();
      var category = categoryInput.value;
      var price = parseFloat(priceInput.value);
      if (!name || isNaN(price)) return;

      if (editingId === null) {
        dishes.push({ id: nextId++, name: name, category: category, price: price });
      } else {
        var dish = dishes.find(function (d) { return d.id === editingId; });
        if (dish) {
          dish.name = name;
          dish.category = category;
          dish.price = price;
        }
      }
      closeModals();
      render();
    });

    document.getElementById('add-btn').addEventListener('click', openAdd);
    document.getElementById('dish-cancel').addEventListener('click', closeModals);
    document.getElementById('delete-cancel').addEventListener('click', closeModals);

    document.getElementById('delete-confirm').addEventListener('click', function () {
      if (deletingId !== null) {
        dishes = dishes.filter(function (d) { return d.id !== deletingId; });
      }
      closeModals();
      render();
    });

    dishModal.addEventListener('click', function (e) {
      if (e.target === dishModal) closeModals();
    });
    deleteModal.addEventListener('click', function (e) {
      if (e.target === deleteModal) closeModals();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModals();
    });

    render();
  </script>
</body>
</html>
